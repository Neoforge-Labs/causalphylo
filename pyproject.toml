[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "causalphylo"
version = "0.1.0"
description = "Pearl's backdoor criterion over knowledge graphs — separates edges that may carry a causal claim from those that only assert co-occurrence"
readme = "README.md"
license = "LicenseRef-CausalPhylo-NonCommercial"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Kelyn Paul Njeri" },
]
keywords = [
    "causal-inference",
    "do-calculus",
    "backdoor-criterion",
    "knowledge-graph",
    "identification",
    "pearl",
    "networkx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The whole point of this package is that identification needs nothing
# but a graph. NetworkX supplies strongly_connected_components and
# is_d_separator; there is no second runtime dependency, and adding one
# would be a reason to re-read this line rather than extend it.
#
# The floor is 3.3 because nx.is_d_separator (used by satisfies_backdoor)
# was added there -- 3.2 ships only the deprecated d_separated spelling.
# Verified by building and testing against networkx==3.3 on Python 3.13
# / macOS arm64. Verified 2026-10-17.
dependencies = [
    "networkx>=3.3",
]

[project.urls]
Homepage = "https://github.com/Neoforge-Labs/causalphylo"
Documentation = "https://causalphylo.neoforgelabs.tech/"
Repository = "https://github.com/Neoforge-Labs/causalphylo"
Issues = "https://github.com/Neoforge-Labs/causalphylo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/causalphylo"]

[tool.hatch.build.targets.sdist]
include = [
    "src/causalphylo/",
    "tests/",
    "docs/",
    "mkdocs.yml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]
docs = [
    # Floors are the versions the site was built and checked against on
    # 2026-10-17: `mkdocs build --strict` clean, and the API page verified to
    # contain prose pulled from the module docstrings rather than headings
    # alone. Verified 2026-10-17.
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.7",
    # A real upper bound, not caution. The Material for MkDocs maintainers
    # state that MkDocs 2.0 removes the plugin system entirely, rewrites
    # theming, and offers no migration path -- which would take out
    # mkdocstrings, the search plugin, and the theme at once. Revisit when
    # Material itself declares support, never by widening this blindly.
    "mkdocs<2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src", "docs"]
addopts = "-q --tb=short --doctest-modules --doctest-glob=*.md"
# The published docs are executable. Every ``>>>`` block in docs/ and in
# the README runs here, so an example cannot drift from the API it
# demonstrates without failing the suite. NORMALIZE_WHITESPACE is for
# prose line-wrapping of long list literals, nothing more.
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.coverage.run]
source = ["src/causalphylo"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "B905", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["causalphylo"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
